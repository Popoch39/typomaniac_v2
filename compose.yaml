# Local Postgres and Redis for `bun run dev` and `bun test` (the API, the matchmaker and the fair-play worker themselves run on the host).
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-typomaniac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typomaniac}
      POSTGRES_DB: ${POSTGRES_DB:-typomaniac}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Postgres 18+ images keep their data under a versioned subfolder of /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  # No volume: a Duel only lives in Redis until it is saved, so nothing there is worth keeping.
  # Published on 6380 rather than 6379, which other local stacks commonly hold.
  redis:
    image: redis:8.4-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
