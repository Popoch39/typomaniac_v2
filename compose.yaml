# Local Postgres for `bun run dev` and `bun test` (the API itself runs on the host).
services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-typomaniac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typomaniac}
      POSTGRES_DB: ${POSTGRES_DB:-typomaniac}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Postgres 18+ images keep their data under a versioned subfolder of /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
